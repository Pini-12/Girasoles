}

function pintar(r, k, e) {
  const p = r[3];
  ctx.fillStyle = "rgb(" + r[0] + "," + r[1] + "," + r[2] + ")";
  ctx.beginPath();
  for (let i = 0; i < p.length; i += 2) {
    const x = (p[i] - minX) * k + e.ox;
    const y = (p[i+1] - minY) * k + e.oy;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fill();
}

let corrida = 0;
function animar() {
  const id = ++corrida;
  btn.classList.remove("visible");
  const { lado, dpr } = ajustarLienzo();
  const px = lado * dpr;
  const k = Math.min((px - 2 * PAD * dpr) / W, (px - 2 * PAD * dpr) / H);
  const e = { ox: (px - W * k) / 2, oy: (px - H * k) / 2 };

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const total = REGIONES.length;
  const porCuadro = Math.max(1, Math.ceil(total / 420)); // ~7 s a 60 fps
  let i = 0;

  function paso() {
    if (id !== corrida) return; // se lanzó otra animación
    const fin = Math.min(i + porCuadro, total);
    for (; i < fin; i++) pintar(REGIONES[i], k, e);
    if (i < total) requestAnimationFrame(paso);
    else btn.classList.add("visible");
  }
  requestAnimationFrame(paso);
}

btn.addEventListener("click", animar);
window.addEventListener("resize", () => {
  // al girar/redimensionar, repinta completo sin animación
  const { lado, dpr } = ajustarLienzo();
  const px = lado * dpr;
  const k = Math.min((px - 2 * PAD * dpr) / W, (px - 2 * PAD * dpr) / H);
  const e = { ox: (px - W * k) / 2, oy: (px - H * k) / 2 };
  corrida++;
  for (const r of REGIONES) pintar(r, k, e);
  btn.classList.add("visible");
});
animar();
</script>
</body>
</html>
